<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon/Avatar context -->
    <linearGradient id="markBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Wing 1: Cyber Cyan to Azure Blue -->
    <linearGradient id="pulseCyanAzure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Wing 2: Electric Azure to Tech Indigo -->
    <linearGradient id="pulseAzureIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Center Spine & Bridge: Luminous Gradient -->
    <linearGradient id="pulseCenterCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.38" />
    </filter>

    <filter id="coreFlare" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="116" fill="url(#markBgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Ambient Blue Halo -->
  <circle cx="256" cy="235" r="150" fill="#0284C7" opacity="0.16" filter="url(#coreFlare)" />

  <!-- Aerodynamic Concept 2: Pulse T-Cloud Vector Body -->
  <g filter="url(#pulseGlow)" transform="translate(0, 8)">
    <!-- Aerodynamic Cloud Canopy Trace (Outer Speed Stream) -->
    <path d="M 120 226 C 120 184 152 150 194 150 C 208 150 222 154 234 162 C 244 136 274 116 310 116 C 354 116 390 146 394 188 C 424 194 444 218 444 252 C 444 290 412 320 374 320 L 320 320"
          fill="none"
          stroke="url(#pulseAzureIndigo)"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.32" />

    <!-- Left Aerodynamic Wing of "T" -->
    <path d="M 136 204 L 244 204 C 252 204 256 208 256 216 L 256 376 C 256 392 242 404 226 404 C 210 404 198 392 198 376 L 198 256 L 136 256 C 120 256 108 244 108 228 C 108 212 120 204 136 204 Z"
          fill="url(#pulseCyanAzure)" />

    <!-- Right Aerodynamic Wing of "T" -->
    <path d="M 376 204 L 268 204 C 260 204 256 208 256 216 L 256 376 C 256 392 270 404 286 404 C 302 404 314 392 314 376 L 314 256 L 376 256 C 392 256 404 244 404 228 C 404 212 392 204 376 204 Z"
          fill="url(#pulseAzureIndigo)" />

    <!-- Cloud Crown Bridge forming upper T canopy dome -->
    <path d="M 176 186 C 188 144 222 114 256 114 C 290 114 324 144 336 186 Z"
          fill="url(#pulseCenterCrown)"
          opacity="0.95" />

    <!-- Central Glowing Data Conduit / Droplet Core (Heartbeat) -->
    <circle cx="256" cy="230" r="16" fill="#FFFFFF" filter="url(#coreFlare)" />
    <circle cx="256" cy="230" r="7" fill="#00F2FE" />
  </g>
</svg>
