<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c2DarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Wing 1: Cyber Cyan to Azure Blue -->
    <linearGradient id="c2PulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Wing 2: Electric Azure to Tech Indigo -->
    <linearGradient id="c2PulseIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Crown & Core -->
    <linearGradient id="c2PulseCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="c2TextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="c2MarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Base with Subtle Border -->
  <rect width="1200" height="360" rx="36" fill="url(#c2DarkBg)" stroke="#1E293B" stroke-width="2" />

  <!-- BRAND MARK (Concept 2: Pulse T) -->
  <g transform="translate(100, 60)" filter="url(#c2MarkGlow)">
    <!-- Icon Backdrop Plate -->
    <rect width="240" height="240" rx="56" fill="#0B132B" stroke="#1E293B" stroke-width="2" />

    <!-- Ambient Glow behind mark -->
    <circle cx="120" cy="115" r="75" fill="#0284C7" opacity="0.2" />

    <!-- Scaled Concept 2 Pulse Mark inside (Scale ~ 0.58) -->
    <g transform="translate(-16, -18) scale(0.53)">
      <!-- Outer Flow Curve -->
      <path d="M 120 226 C 120 184 152 150 194 150 C 208 150 222 154 234 162 C 244 136 274 116 310 116 C 354 116 390 146 394 188 C 424 194 444 218 444 252 C 444 290 412 320 374 320 L 320 320"
            fill="none"
            stroke="url(#c2PulseIndigo)"
            stroke-width="20"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.35" />

      <!-- Left T Wing -->
      <path d="M 136 204 L 244 204 C 252 204 256 208 256 216 L 256 376 C 256 392 242 404 226 404 C 210 404 198 392 198 376 L 198 256 L 136 256 C 120 256 108 244 108 228 C 108 212 120 204 136 204 Z"
            fill="url(#c2PulseCyan)" />

      <!-- Right T Wing -->
      <path d="M 376 204 L 268 204 C 260 204 256 208 256 216 L 256 376 C 256 392 270 404 286 404 C 302 404 314 392 314 376 L 314 256 L 376 256 C 392 256 404 244 404 228 C 404 212 392 204 376 204 Z"
            fill="url(#c2PulseIndigo)" />

      <!-- Cloud Crown Dome -->
      <path d="M 176 186 C 188 144 222 114 256 114 C 290 114 324 144 336 186 Z"
            fill="url(#c2PulseCrown)"
            opacity="0.95" />

      <!-- Core Luminous Spark -->
      <circle cx="256" cy="230" r="16" fill="#FFFFFF" />
      <circle cx="256" cy="230" r="8" fill="#00F2FE" />
    </g>
  </g>

  <!-- WORDMARK & TYPOGRAPHY -->
  <g transform="translate(390, 195)">
    <!-- Main Logotype -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist Sans', Roboto, sans-serif"
          font-weight="800"
          font-size="106"
          letter-spacing="-3px">
      <!-- "Tibi" in Stark White -->
      <tspan fill="#F8FAFC">Tibi</tspan>
      <!-- "Cloud" in Cyan-Indigo Gradient -->
      <tspan fill="url(#c2TextGrad)" font-weight="700">Cloud</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="58"
          x="6"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="600"
          font-size="20"
          letter-spacing="9px"
          fill="#94A3B8">
      CLOUD INFRASTRUCTURE PLATFORM
    </text>

    <!-- Badge Tag -->
    <g transform="translate(560, -82)">
      <rect width="112" height="34" rx="17" fill="#0369A1" opacity="0.35" />
      <rect width="112" height="34" rx="17" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />
      <text x="56" y="22"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="13"
            font-weight="700"
            fill="#38BDF8"
            letter-spacing="2px"
            text-anchor="middle">v2.0 PRO</text>
    </g>
  </g>
</svg>
